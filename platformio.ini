; ══════════════════════════════════════════════════
;  CoastalWeather — Freenove ESP32-S3 2.8" ILI9341 (240x320)
;
;  A remote TFT display that pulls NWS weather, NOAA tide, and marine
;  advisory data over WiFi and shows it on-screen. Graphics via TFT_eSPI,
;  configured entirely through build_flags below (no User_Setup.h to edit).
;
;  Backlight is on GPIO45 (confirmed working on this Freenove board).
;  The other TFT SPI pins are set below — VERIFY them against the board /
;  the prior Freenove display project before first flash.
; ══════════════════════════════════════════════════

[platformio]
default_envs = esp32s3

; ── Shared settings ──────────────────────────────
[env]
framework    = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson @ ^7.3.1
    bodmer/TFT_eSPI @ ^2.5.43
    ayushsharma82/ElegantOTA@3.1.7

; TFT_eSPI configuration (replaces User_Setup.h — all via -D flags).
; These values are the VERIFIED config for the Freenove FNK0104AB 2.8" board,
; copied from the proven ESP32-Freenove-S3-Display firmware that runs on this
; exact hardware. Do NOT "simplify" them — every line matters:
;   * ILI9341_2_DRIVER (not ILI9341_DRIVER) is the correct panel variant
;   * TFT_DC=46, TFT_RST=-1 (RST tied to CHIP_PU)
;   * USE_HSPI_PORT=1 avoids a tft.init() StoreProhibited boot-loop on this
;     TFT_eSPI + ESP32-S3 core combo
;   * TFT_BGR + TFT_INVERSION_ON give correct colors on this IPS panel
build_flags =
    -I.                       ; project root on include path (for version.h)
    -DCORE_DEBUG_LEVEL=1
    -DUSER_SETUP_LOADED=1
    -DILI9341_2_DRIVER=1
    -DTFT_RGB_ORDER=TFT_BGR
    -DTFT_INVERSION_ON
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    ; ── TFT SPI pins (Freenove FNK0104AB — verified) ──
    -DTFT_MOSI=11
    -DTFT_MISO=13
    -DTFT_SCLK=12
    -DTFT_CS=10
    -DTFT_DC=46
    -DTFT_RST=-1
    ; ── Backlight — GPIO45 (HIGH = on) ──
    -DTFT_BL=45
    -DTFT_BACKLIGHT_ON=HIGH
    ; ── Fonts ──
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    ; ── SPI speed + HSPI port (crash fix) ──
    -DSPI_FREQUENCY=27000000
    -DUSE_HSPI_PORT=1

; ── Freenove ESP32-S3 — USB (first flash) ────────
[env:esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1

; ── Freenove ESP32-S3 — OTA ──────────────────────
[env:esp32s3-ota]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
upload_protocol = espota
; OTA by fixed IP (more reliable than mDNS on Windows).
; mDNS alt: coastalweather.local
upload_port = 192.168.1.48
